name: app

on:
  pull_request:
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION_FILE: app/go.mod
  SERVICE_NAME: items-api
  # Pinned so every job scans and deploys the same tool versions.
  TRIVY_IMAGE: aquasec/trivy:0.76.2

jobs:
  # ---- Quality gates: run on every PR, need no AWS access ------------------
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: app/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: app

  test:
    name: test (race + coverage gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: app/go.sum
      - name: Run tests and enforce 80% coverage
        working-directory: app
        run: ./scripts/coverage-gate.sh
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage.out
          if-no-files-found: ignore
          retention-days: 14

  hadolint:
    name: lint (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

  # ---- Image: build once, scan, SBOM, keep the exact bytes for promotion ----
  image:
    name: image (build, scan, SBOM)
    needs: [lint, test, hadolint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (BuildKit cache)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          load: true
          tags: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          provenance: false

      - name: Scan image with Trivy (fail on fixable CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --scanners vuln,secret \
              "${SERVICE_NAME}:${GITHUB_SHA}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Export image for promotion
        run: |
          docker save "${SERVICE_NAME}:${GITHUB_SHA}" --output "${RUNNER_TEMP}/image.tar"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 7

  # ---- Promotion: only with AWS variables configured, only on main ----------
  deploy-staging:
    name: deploy staging
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN_STAGING != ''
    runs-on: ubuntu-24.04
    environment: staging
    env:
      AWS_REGION: us-east-1
      CLUSTER: items-api-staging
      SERVICE: items-api
      CODEDEPLOY_APP: items-api
      CODEDEPLOY_GROUP: items-api-staging
      CONTAINER_NAME: items-api
      CONTAINER_PORT: "8080"
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Load image
        run: docker load --input "${RUNNER_TEMP}/image/image.tar"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Push image tagged with the commit SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="${REGISTRY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker tag "${SERVICE_NAME}:${GITHUB_SHA}" "$image_uri"
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Render task definition and AppSpec
        run: |
          deploy/render-taskdef.sh \
            --cluster "$CLUSTER" --service "$SERVICE" \
            --container "$CONTAINER_NAME" --port "$CONTAINER_PORT" \
            --image "$IMAGE_URI" --version "$GITHUB_SHA" \
            --out deploy/out

      - name: Blue/green deploy through CodeDeploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: deploy/out/taskdef.json
          service: ${{ env.SERVICE }}
          cluster: ${{ env.CLUSTER }}
          codedeploy-appspec: deploy/out/appspec.yaml
          codedeploy-application: ${{ env.CODEDEPLOY_APP }}
          codedeploy-deployment-group: ${{ env.CODEDEPLOY_GROUP }}
          wait-for-service-stability: true

      - name: Smoke test
        run: deploy/smoke-test.sh "${{ vars.STAGING_BASE_URL }}"

  deploy-prod:
    name: deploy prod (canary)
    needs: [image, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN_PROD != ''
    runs-on: ubuntu-24.04
    # Required reviewers on this environment provide the manual approval gate.
    environment: prod
    env:
      AWS_REGION: us-east-1
      CLUSTER: items-api-prod
      SERVICE: items-api
      CODEDEPLOY_APP: items-api
      CODEDEPLOY_GROUP: items-api-prod
      CONTAINER_NAME: items-api
      CONTAINER_PORT: "8080"
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Load image
        run: docker load --input "${RUNNER_TEMP}/image/image.tar"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Push image to the prod registry
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="${REGISTRY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker tag "${SERVICE_NAME}:${GITHUB_SHA}" "$image_uri"
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Render task definition and AppSpec
        run: |
          deploy/render-taskdef.sh \
            --cluster "$CLUSTER" --service "$SERVICE" \
            --container "$CONTAINER_NAME" --port "$CONTAINER_PORT" \
            --image "$IMAGE_URI" --version "$GITHUB_SHA" \
            --out deploy/out

      # The deployment group uses CodeDeployDefault.ECSCanary10Percent5Minutes.
      # Alarms stop and roll back the canary automatically, so this step only starts it.
      - name: Canary deploy through CodeDeploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: deploy/out/taskdef.json
          service: ${{ env.SERVICE }}
          cluster: ${{ env.CLUSTER }}
          codedeploy-appspec: deploy/out/appspec.yaml
          codedeploy-application: ${{ env.CODEDEPLOY_APP }}
          codedeploy-deployment-group: ${{ env.CODEDEPLOY_GROUP }}
          wait-for-service-stability: true

      - name: Smoke test
        run: deploy/smoke-test.sh "${{ vars.PROD_BASE_URL }}"
